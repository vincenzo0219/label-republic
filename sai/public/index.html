<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사이</title>
<style>
  :root {
    --bg: #f6f3ef; --card: #ffffff; --ink: #2b2622; --muted: #8a817a; --line: #e7e1da;
    --accent: #c4623d; --accent-ink: #ffffff; --ai: #f1ebe4; --me: #2b2622; --me-ink: #ffffff;
    --partner: #e3ecf2; --sys: #8a817a; --lock: #4d6b57;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1917; --card: #24211e; --ink: #ede7e1; --muted: #a39a92; --line: #37322d;
      --accent: #e07a52; --accent-ink: #1b1917; --ai: #2e2a26; --me: #ede7e1; --me-ink: #1b1917;
      --partner: #263139; --sys: #a39a92; --lock: #8fb39b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 640px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }

  /* 첫 화면 */
  .intro { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 20px; gap: 14px; }
  .intro h1 { font-size: 40px; margin: 0; letter-spacing: -1px; }
  .intro p { margin: 0; color: var(--muted); line-height: 1.6; }
  .intro input { padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 16px; }
  .primary { padding: 14px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 600; }
  .primary:disabled { opacity: .5; }
  .fine { font-size: 12px; color: var(--muted); line-height: 1.5; }

  /* 상담방 */
  header { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
  header .title { font-weight: 700; }
  header .who { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .switch { display: flex; gap: 6px; margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .switch button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 9px 6px; border-radius: 9px; font-size: 14px; }
  .switch button.on { background: var(--ink); color: var(--bg); font-weight: 600; }
  .switch button:disabled { opacity: .45; cursor: default; }
  .note { font-size: 12px; color: var(--lock); margin-top: 8px; }

  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 11px 14px; border-radius: 16px; line-height: 1.6; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
  .msg .by { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .ai { background: var(--ai); align-self: flex-start; border-top-left-radius: 4px; }
  .me { background: var(--me); color: var(--me-ink); align-self: flex-end; border-top-right-radius: 4px; }
  .me .by { color: inherit; opacity: .7; }
  .partner { background: var(--partner); align-self: flex-start; border-top-left-radius: 4px; }
  .sys { align-self: center; font-size: 12px; color: var(--sys); text-align: center; padding: 2px 8px; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 4px 6px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 16px 8px; font-size: 14px; line-height: 1.5; }
  .card .row { display: flex; gap: 8px; margin-top: 8px; }
  .card .row button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .card .row button.primary { border: 0; background: var(--accent); color: var(--accent-ink); }
  .agreements li { margin: 2px 0; }

  footer { padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
  .tools { display: flex; gap: 6px; padding: 0 0 8px; }
  .tools button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 12px; font-size: 13px; }
  .tools button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .msg.pre { border: 1px dashed var(--accent); }
  .turn { font-size: 12px; color: var(--muted); padding: 0 4px 6px; }
  .compose { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; max-height: 140px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; line-height: 1.4; }
  .send { border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); padding: 12px 16px; font-weight: 600; }
  .send:disabled { opacity: .45; }
  .err { color: var(--accent); font-size: 13px; padding: 4px 4px 0; min-height: 0; }
  .report { white-space: pre-wrap; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const $app = document.getElementById("app");
const url = new URL(location.href);
const roomFromPath = (location.pathname.match(/^\/r\/([\w-]+)/) || [])[1] || null;
const inviteToken = url.searchParams.get("invite");
const tokenKey = (id) => `sai:token:${id}`;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let state = null;       // 서버가 준 방 상태 (내가 볼 수 있는 것만)
let view = "private";   // "private" | "joint"
let token = null;
let es = null;
let precheckMode = false; // 상대에게 보낼 메시지를 붙여넣는 중

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "문제가 생겼어요.");
  return data;
}

// ---------- 첫 화면 ----------
function renderIntro() {
  const invited = roomFromPath && inviteToken;
  $app.innerHTML = `
    <div class="intro">
      <h1>사이</h1>
      ${invited
        ? `<p>함께 상담에 초대받았어요.<br>먼저 상담사와 1:1로 잠깐 이야기한 다음, 셋이 함께 이야기해요.<br>여기서 하는 1:1 이야기는 상대에게 그대로 공개되지 않아요.</p>`
        : `<p>둘 사이가 어려울 때 들어오세요.<br>상담사가 먼저 이야기를 듣고, 필요하면 상대를 불러 셋이 함께 풀어요.</p>`}
      <input id="name" maxlength="20" placeholder="이름 또는 별명" autocomplete="nickname">
      <button class="primary" id="go">${invited ? "들어가기" : "상담 시작"}</button>
      <div class="err" id="err"></div>
      <p class="fine">사이는 AI 상담사이며 의료 서비스가 아닙니다. 폭력이나 위험한 상황이라면 112, 1366(여성긴급전화), 109(자살예방상담)에 바로 연락하세요.</p>
    </div>`;
  const go = document.getElementById("go");
  const name = document.getElementById("name");
  name.focus();
  name.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) go.click(); });
  go.onclick = async () => {
    go.disabled = true;
    try {
      if (invited) {
        const r = await api(`/api/rooms/${roomFromPath}/join`, { invite: inviteToken, name: name.value });
        store.set(tokenKey(roomFromPath), r.token);
        history.replaceState(null, "", `/r/${roomFromPath}`);
        enterRoom(roomFromPath, r.token);
      } else {
        const r = await api("/api/rooms", { name: name.value });
        store.set(tokenKey(r.roomId), r.token);
        history.replaceState(null, "", `/r/${r.roomId}`);
        enterRoom(r.roomId, r.token);
      }
    } catch (e) {
      document.getElementById("err").textContent = e.message;
      go.disabled = false;
    }
  };
}

// ---------- 상담방 ----------
function enterRoom(roomId, tok) {
  token = tok;
  $app.innerHTML = `
    <header>
      <div class="title">우리 둘의 상담방</div>
      <div class="who" id="who"></div>
      <div class="switch">
        <button id="tabPrivate">🔒 나 + 상담사</button>
        <button id="tabJoint">👥 함께 상담</button>
      </div>
      <div class="note" id="note"></div>
    </header>
    <main id="msgs"></main>
    <div id="cards"></div>
    <footer>
      <div class="tools" id="tools">
        <button id="practice">🎭 연습하기</button>
        <button id="precheckBtn">✉️ 보내기 전 코치</button>
      </div>
      <div class="turn" id="turn"></div>
      <div class="compose">
        <textarea id="input" rows="1" placeholder="무슨 일이 있었어요?"></textarea>
        <button class="send" id="send">보내기</button>
      </div>
      <div class="err" id="err"></div>
    </footer>`;
  document.getElementById("tabPrivate").onclick = () => { view = "private"; render(); };
  document.getElementById("tabJoint").onclick = () => { if (state?.jointStarted) { view = "joint"; render(); } };
  const input = document.getElementById("input");
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer: fine)").matches) { e.preventDefault(); send(); }
  });
  document.getElementById("send").onclick = send;
  document.getElementById("precheckBtn").onclick = () => { precheckMode = !precheckMode; render(); document.getElementById("input").focus(); };
  document.getElementById("practice").onclick = async () => {
    precheckMode = false;
    try { await api(`/api/rooms/${state.roomId}/practice`, { token }); setErr(""); } catch (e) { setErr(e.message); }
  };

  es?.close();
  es = new EventSource(`/api/rooms/${roomId}/events?token=${encodeURIComponent(tok)}`);
  let first = true;
  es.onmessage = (ev) => {
    const prev = state;
    state = JSON.parse(ev.data);
    // 공동 상담이 막 열리면 자동으로 함께 상담 화면으로 옮긴다.
    if (state.jointStarted && (first || !prev?.jointStarted)) view = "joint";
    if (!state.jointStarted) view = "private";
    first = false;
    render();
  };
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) setErr("연결이 끊겼어요. 새로고침해 주세요."); };
}

function setErr(t) { const el = document.getElementById("err"); if (el) el.textContent = t || ""; }

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text || !state) return;
  const channel = view === "joint" ? "joint" : (state.me.who === "A" ? "privA" : "privB");
  document.getElementById("send").disabled = true;
  try {
    if (precheckMode && view === "private") {
      await api(`/api/rooms/${state.roomId}/precheck`, { token, text });
      precheckMode = false;
    } else {
      await api(`/api/rooms/${state.roomId}/messages`, { token, channel, text });
    }
    input.value = ""; input.style.height = "auto"; setErr("");
  } catch (e) { setErr(e.message); }
  finally { document.getElementById("send").disabled = false; }
}

function render() {
  if (!state) return;
  const s = state;
  const partner = s.partner?.name;
  document.getElementById("who").textContent = `${s.me.name}${partner ? " · " + partner : ""} · 상담사`;

  const tp = document.getElementById("tabPrivate"), tj = document.getElementById("tabJoint");
  tp.classList.toggle("on", view === "private");
  tj.classList.toggle("on", view === "joint");
  tj.disabled = !s.jointStarted;
  document.getElementById("note").textContent = view === "private"
    ? `여기 대화는 ${partner ? partner + "님" : "상대"}에게 보이지 않아요.`
    : "세 사람이 함께 보는 대화예요. 상담사가 순서를 정해요.";

  // 메시지
  const channel = view === "joint" ? "joint" : (s.me.who === "A" ? "privA" : "privB");
  const box = document.getElementById("msgs");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const html = s.messages.filter((m) => m.channel === channel).map((m) => {
    if (m.author === "system") return `<div class="sys">${esc(m.text)}</div>`;
    if (m.author === "AI") return `<div class="msg ai"><div class="by">상담사</div>${esc(m.text)}</div>`;
    if (m.author === s.me.who && m.kind === "precheck") return `<div class="msg me pre"><div class="by">✉️ 보내기 전 검사</div>${esc(m.text)}</div>`;
    if (m.author === s.me.who) return `<div class="msg me">${view === "joint" ? `<div class="by">${esc(s.me.name)}</div>` : ""}${esc(m.text)}</div>`;
    return `<div class="msg partner"><div class="by">${esc(partner || "상대")}</div>${esc(m.text)}</div>`;
  }).join("");
  const thinking = view === "joint" ? s.thinking.joint : s.thinking.private;
  box.innerHTML = html + (thinking ? `<div class="typing">상담사가 생각하는 중…</div>` : "");
  if (atBottom || thinking) box.scrollTop = box.scrollHeight;

  // 차례 표시 (공동방)
  const turn = document.getElementById("turn");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  let canSend = !thinking;
  if (view === "joint") {
    const mine = s.nextSpeaker === "both" || s.nextSpeaker === s.me.who;
    canSend = canSend && mine;
    turn.textContent = thinking ? "" : s.nextSpeaker === "both" ? "두 분 모두 말할 수 있어요." : mine ? "지금은 내 차례예요." : `지금은 ${partner}님 차례예요. 잠시 들어주세요.`;
    input.placeholder = mine ? "말해보세요" : "상대 차례예요";
  } else {
    turn.textContent = precheckMode ? "상대에게 보내려는 메시지를 그대로 붙여넣으세요. 상대에겐 가지 않아요." : "";
    input.placeholder = precheckMode ? "보내려는 메시지 붙여넣기" : s.jointStarted ? "상담사에게만 하고 싶은 말" : "무슨 일이 있었어요?";
  }
  document.getElementById("tools").classList.toggle("hidden", view !== "private");
  document.getElementById("precheckBtn").classList.toggle("on", precheckMode);
  document.getElementById("practice").disabled = thinking;
  input.disabled = !canSend && view === "joint";
  sendBtn.disabled = !canSend;
  sendBtn.textContent = precheckMode && view === "private" ? "검사" : "보내기";

  renderCards();
}

function renderCards() {
  const s = state;
  const cards = [];

  // 초대 (먼저 온 사람만, 상담사가 제안했거나 대화가 어느 정도 진행된 뒤)
  if (s.inviteUrlPath && view === "private" && s.inviteSuggested) {
    cards.push(`<div class="card">상대방을 초대해 보세요. 들어오면 상담사가 먼저 1:1로 이야기를 듣고, 그다음 셋이 함께해요.
      <div class="row"><button class="primary" id="share">초대 링크 보내기</button><button id="copy">링크 복사</button></div></div>`);
  }

  // 함께 상담 시작
  if (s.partner && !s.jointStarted && !s.jointBlocked && view === "private") {
    const msg = s.wantsJoint.me
      ? `${s.partner.name}님이 준비되면 함께 상담이 시작돼요.`
      : s.wantsJoint.partner
        ? `${s.partner.name}님은 준비됐어요. 나도 준비되면 눌러주세요.`
        : s.aiRecommendsJoint
          ? "상담사가 두 분 이야기를 충분히 들었어요. 함께 이야기해 볼까요?"
          : "상담사와 충분히 이야기한 뒤 함께 상담을 시작할 수 있어요.";
    cards.push(`<div class="card">${esc(msg)}
      ${s.wantsJoint.me ? "" : `<div class="row"><button class="primary" id="joint">👥 함께 상담 시작</button></div>`}</div>`);
  }

  // 합의된 약속
  if (view === "joint" && s.agreements.length) {
    cards.push(`<div class="card"><b>함께 정한 약속</b><ul class="agreements">${s.agreements.map((a) => `<li>${esc(a)}</li>`).join("")}</ul></div>`);
  }

  // 리포트
  if (view === "joint" && s.agreements.length && !s.report) {
    cards.push(`<div class="card">오늘 상담을 한 장으로 정리해 드릴게요.<div class="row"><button id="report">사이 리포트 받기</button></div></div>`);
  }
  if (view === "joint" && s.report) {
    cards.push(`<div class="card report">${esc(s.report)}</div>`);
  }

  document.getElementById("cards").innerHTML = cards.join("");
  const full = s.inviteUrlPath ? location.origin + s.inviteUrlPath : "";
  const share = document.getElementById("share");
  if (share) share.onclick = async () => {
    const text = `${s.me.name}님이 '사이'에서 함께 상담하자고 초대했어요. 먼저 상담사와 1:1로 이야기하고, 그다음 셋이 함께해요.`;
    if (navigator.share) { try { await navigator.share({ title: "사이 상담 초대", text, url: full }); } catch {} }
    else { await navigator.clipboard.writeText(`${text}\n${full}`); setErr("초대 문구와 링크를 복사했어요."); }
  };
  const copy = document.getElementById("copy");
  if (copy) copy.onclick = async () => { await navigator.clipboard.writeText(full); setErr("링크를 복사했어요."); };
  const joint = document.getElementById("joint");
  if (joint) joint.onclick = async () => {
    joint.disabled = true;
    try { await api(`/api/rooms/${s.roomId}/joint`, { token }); } catch (e) { setErr(e.message); joint.disabled = false; }
  };
  const report = document.getElementById("report");
  if (report) report.onclick = async () => {
    report.disabled = true; report.textContent = "정리하는 중…";
    try { await api(`/api/rooms/${s.roomId}/report`, { token }); } catch (e) { setErr(e.message); report.disabled = false; }
  };
}

// ---------- 시작 ----------
if (roomFromPath && !inviteToken && store.get(tokenKey(roomFromPath))) {
  enterRoom(roomFromPath, store.get(tokenKey(roomFromPath)));
} else if (roomFromPath && inviteToken && store.get(tokenKey(roomFromPath))) {
  // 이미 들어온 적 있는 사람이 초대 링크를 다시 열면 그냥 방으로
  history.replaceState(null, "", `/r/${roomFromPath}`);
  enterRoom(roomFromPath, store.get(tokenKey(roomFromPath)));
} else {
  renderIntro();
}
</script>
</body>
</html>
