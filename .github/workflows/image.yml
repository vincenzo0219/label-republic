name: Image

# 운영 이미지를 GitHub 에서 빌드해 GHCR 에 올린다 (무중단 배포, 10/25).
# 서버의 자동 업데이트(deploy/auto-update.sh)는 main 의 커밋과 같은 태그(sha-<커밋>)를 받아 쓰기만 하므로,
# 운영 서버에서 next build 를 돌리느라 사이트가 10~15분 느려지던 일이 없어진다.
# 패키지가 비공개면 서버가 받지 못하고 예전처럼 서버에서 빌드한다 — docs/RUNBOOK.md 4장 "이미지 공개" 1회 설정.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 연달아 머지되면 마지막 커밋만 만든다 (서버는 늘 main 의 최신 커밋만 배포)
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 운영 서버(Lightsail x86_64)와 같은 플랫폼
          platforms: linux/amd64
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.name.outputs.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
