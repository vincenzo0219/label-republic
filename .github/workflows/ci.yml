name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck · Test · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labelrep
          POSTGRES_PASSWORD: labelrep
          POSTGRES_DB: labelrep
          # 운영과 같은 정렬 규칙 (docker-compose.yml, Sprint 38)
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ko --locale=C.UTF-8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labelrep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://labelrep:labelrep@localhost:5432/labelrep
      TEST_DATABASE_URL: postgres://labelrep:labelrep@localhost:5432/labelrep_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Create test database
        run: PGPASSWORD=labelrep psql -h localhost -U labelrep -d labelrep -c "CREATE DATABASE labelrep_test"

      - name: Migrations apply cleanly and are idempotent
        run: |
          npm run db:migrate
          npm run db:migrate

      - name: Unit + DB integration tests
        run: npm test

      - name: Production build
        run: npx next build

      - name: Smoke test the production server
        env:
          NODE_ENV: production
          PORT: "3000"
          APP_SECRET: ci-only-${{ github.run_id }}-0123456789abcdefghijklmnop
          SITE_URL: http://localhost:3000
          CONTACT_EMAIL: ci@example.org
          ENV_CHECK: warn
        run: |
          node --import tsx server.ts > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"'
          for p in "/" "/c/supplements" "/search?q=test" "/write" "/boards" "/privacy" "/terms" "/policy" "/transparency" "/sitemap.xml" "/robots.txt"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$p")
            echo "$code $p"
            test "$code" = "200"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin)" = "404"   # ADMIN_PASSWORD 미설정 시 비활성

      - name: Server log
        if: always()
        run: cat server.log || true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: labelrepublic:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
