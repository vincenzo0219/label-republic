# 로컬에서 운영 이미지를 그대로 띄워보기 위한 구성
#   cp .env.example .env  # 값 채우기
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: labelrep
      POSTGRES_PASSWORD: labelrep
      POSTGRES_DB: labelrep
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelrep"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://labelrep:labelrep@db:5432/labelrep
      RUN_MIGRATIONS: "true"
      # CPU 코어 수만큼 워커 (Sprint 10)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-auto}
    ports:
      - "3000:3000"
    volumes:
      # 첨부 이미지 (IMAGE_STORAGE=local)
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
